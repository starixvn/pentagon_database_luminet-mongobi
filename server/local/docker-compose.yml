version: '3.8'

services:
  l1bi:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile.mongobi.debian-slim
    container_name: L1BI
    hostname: l1bi
    restart: always
    networks:
      l1_sabadb_network:
        ipv4_address: 172.39.56.65
    ports:
      - '0.0.0.0:28101:28101'
    volumes:
      - ./.storage/l1bi/log:/var/log/mongosqld:rw
      - ./config/mongosqld.l1.conf:/etc/mongosqld.conf:ro
    secrets:
      - mongosqld_ssl
  l1pbi:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile.mongobi.debian-slim
    container_name: L1pBI
    hostname: l1pbi
    restart: always
