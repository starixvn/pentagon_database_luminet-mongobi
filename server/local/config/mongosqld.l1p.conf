systemLog:
  verbosity: 1
  path: '/var/log/mongosqld/mongosqld.log'
mongodb:
  net:
    uri: 'mongodb://10.10.50.14:27104/?tls=false&replicaSet=L1pLocal'
    auth:
      username: 'mongosqld'
      password: 'MongoSQLd'
      source: 'admin'
schema:
  maxVarcharLength: 8000
  stored:
    mode: custom
    source: schema
    name: L1BI-sch
  refreshIntervalSecs: 60
runtime:
  memory:
    maxPerStage: 104857600
    maxPerServer: 524288000
    maxPerConnection: 104857600
net:
  bindIp: 0.0.0.0
  port: 28104
  ssl:
    mode: allowSSL
    allowInvalidCertificates: true
    PEMKeyFile: /run/secrets/mongosqld_ssl
security:
  enabled: true
  defaultSource: 'admin'
